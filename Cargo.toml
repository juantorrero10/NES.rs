[package]
name = "nes"
version = "0.1.0"
edition = "2024"

[features]
log = []

[dependencies]
colored = "3.1.1"
imgui = { version = "0.12.0", features = ["docking"] }
# lazy_static = "1.5.0"
log = "0.4.32"
postcard = "1.1.3"
# rand = "0.10.1"
raylib = "5.5.1"
raylib_imgui_rs = "0.5.0"
rfd = "0.17.2"
ringbuf = "0.5.0"
serde = { version = "1.0.228", features = ["derive"] }
simple_logger = "5.2.0"
thiserror = "2.0.18"
time = "0.3.47"
zstd = "0.13.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }
# tracy-client = "0.18.4"
